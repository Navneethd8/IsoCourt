name: Ping HuggingFace Space

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        # We use a GET request and extract the HTTP status code. 
        # A 405 for HEAD is common for spaces, so we use GET and output to /dev/null.
        run: |
          URL="https://navneethdg-badcoach.hf.space/health"
          for i in 1 2 3 4 5 6; do
            STATUS_CODE=$(curl -sS -m 60 -o /tmp/hf_ping_body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS_CODE"
            if [[ "$STATUS_CODE" =~ ^2 ]]; then
              echo "Successfully pinged HF Space, keeping it awake!"
              exit 0
            fi
            sleep 20
          done
          echo "Space did not return 2xx after retries."
          exit 1
